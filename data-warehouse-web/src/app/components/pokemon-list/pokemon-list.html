<h2>Pokemon Events</h2>

<app-custom-table
  [data]="pokemonEvents"
  rowKey="eventID"
  [allColumns]="cols"
  [(selectedColumns)]="selectedColumns"
  addButtonLabel="Add Pokemon Event"
  [numRowsToDisplay]="25"
  [rowsPerPageOtions]="[25, 50, 100]"
  [isScrollable]="true"
  [scrollDirection]="horizontal"
  [sortMode]="multiple"
  [areColumnsResizable]="true"
  [shouldShowRowHover]="true"
  dialogHeader="Edit Pokemon Event"
  dialogEditHeader="Update the Pokemon Event"
  (rowAdded)="addRow()"
  (rowSaved)="saveRow(pokemonEvent)"
  >
</app-custom-table>
