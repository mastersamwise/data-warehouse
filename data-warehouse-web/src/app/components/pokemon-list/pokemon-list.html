<h2>Pokemon Events</h2>
<button (click)="loadEvents()">Load Events</button>

<div *ngIf="pokemonEvents.length === 0">
    Click the button to load events.
</div>

<!--- https://primeng.org/table#filter-basic -->

<div class="card">
  <p-table [columns]="cols" [value]="pokemonEvents" stripedRows [tableStyle]="{ 'min-width': '75rem' }">
      <ng-template #header let-columns>
          <tr>
              @for (col of columns; track col) {
                  <th>
                      {{ col.header }}
                  </th>
              }
          </tr>
      </ng-template>
      <ng-template #body let-rowData let-columns="columns">
          <tr>
              @for (col of columns; track col) {
                  <td>
                      {{ rowData[col.field] }}
                  </td>
              }
          </tr>
      </ng-template>
  </p-table>
</div>
